{% extends "base.html" %}

{% block title %}Predict Churn{% endblock %}

{% block content %}
    <h1>Predict Customer Churn</h1>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/predict" class="predict-form">

        <div class="form-group">
            <label for="model_choice">Select Model</label>
            <select name="model_choice" id="model_choice" required>
                {% for name in model_names %}
                    <option value="{{ name }}">{{ name }}</option>
                {% endfor %}
            </select>
        </div>

        <h3>Customer Details</h3>

        {% for field, options in categories.items() %}
            <div class="form-group">
                <label for="{{ field }}">{{ field }}</label>
                <select name="{{ field }}" id="{{ field }}" required>
                    {% for option in options %}
                        <option value="{{ option }}">{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
        {% endfor %}

        <div class="form-group">
            <label for="tenure">Tenure (months)</label>
            <input type="number" name="tenure" id="tenure" min="0" max="100" required>
        </div>

        <div class="form-group">
            <label for="MonthlyCharges">Monthly Charges ($)</label>
            <input type="number" step="0.01" name="MonthlyCharges" id="MonthlyCharges" min="0" required>
        </div>

        <div class="form-group">
            <label for="TotalCharges">Total Charges ($)</label>
            <input type="number" step="0.01" name="TotalCharges" id="TotalCharges" min="0" required>
        </div>

        <button type="submit" class="btn">Predict Churn</button>
    </form>
{% endblock %}
